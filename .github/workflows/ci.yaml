name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: python -m unittest -v
      - name: Benchmark (smoke run)
        run: python benchmark.py --searches 200

  mapreduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Hadoop client jars
        uses: actions/cache@v4
        with:
          path: MapReduce/lib
          key: hadoop-jars-${{ hashFiles('MapReduce/jars.txt') }}
      - name: Build jar (javac + jar)
        run: MapReduce/build.sh
      - name: Run TermIndex in Hadoop local mode
        working-directory: MapReduce
        run: java -cp "term-index.jar:lib/*" TermIndex ../sample_text "$RUNNER_TEMP/term-index"
      - name: Compare with the Python index
        run: python MapReduce/compare_with_python.py "$RUNNER_TEMP/term-index"
